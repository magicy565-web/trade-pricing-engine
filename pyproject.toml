[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-pricing-engine"
version = "0.1.0"
description = "Evidence-backed export quotation, contribution-margin decisions and human approval"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.2", "pydantic==2.13.5", "uvicorn==0.48.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]

[project.scripts]
trade-pricing = "trade_pricing.cli:main"

[tool.setuptools.packages.find]
include = ["trade_pricing*"]

[tool.setuptools.package-data]
trade_pricing = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
